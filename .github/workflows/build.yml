name: Build

on:
  workflow_call:
    inputs:
      os-name:
        required: true
        type: string
      os-version:
        required: true
        type: string
      build-type-name:
        required: true
        type: string
      cpp-version-name:
        required: true
        type: string
      cpp-version-number:
        required: true
        type: string
      compiler-toolset:
        required: true
        type: string
      compiler-version:
        required: true
        type: string
      compiler-executable:
        required: true
        type: string
      compiler-cxxflags:
        required: false
        type: string
        default: ""
      msvc-toolset-prefix:
        required: false
        type: string
        default: ""
        description: 'Version prefix of the MSVC toolset; the newest installed match is used (e.g. "14.5")'
      msvc-platform-toolset:
        required: false
        type: string
        default: ""
        description: 'Visual Studio platform toolset passed to CMake -T (e.g. "v145")'
      cmake-config-additional-args:
        required: false
        type: string
        default: ""
      compiler-builder-additional-args:
        required: false
        type: string
        default: ""
      components:
        required: true
        type: string
        description: 'JSON array of components to build (e.g. ["iris", "alloy","x4"])'

env:
  IRIS_CI_BUILD_JOBS: 4

jobs:
  prepare-deps:
    name: "Dependencies"
    runs-on: ${{ inputs.os-name }}-${{ inputs.os-version }}

    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Copy Local GitHub Actions
        shell: bash
        run: |
          if [ -e modules/iris ]; then
            cp -r modules/iris/.github/actions .github/
          fi

      - name: Setup Toolchain
        id: setup
        uses: ./.github/actions/setup-cpp
        with:
          os-name: ${{ inputs.os-name }}
          os-version: ${{ inputs.os-version }}
          compiler-toolset: ${{ inputs.compiler-toolset }}
          compiler-version: ${{ inputs.compiler-version }}
          compiler-executable: ${{ inputs.compiler-executable }}
          msvc-toolset-prefix: ${{ inputs.msvc-toolset-prefix }}
          cpp-version-name: ${{ inputs.cpp-version-name }}
          build-type-name: ${{ inputs.build-type-name }}

      - name: Cache CMake Dependencies (restore)
        id: cache-deps
        uses: actions/cache/restore@v5
        with:
          key: ${{ steps.setup.outputs.deps-cache-key }}
          path: ${{ github.workspace }}/build/_deps

      # Adapt CMP0168; enable caching in CI
      # https://cmake.org/cmake/help/latest/module/FetchContent.html#variable:FETCHCONTENT_FULLY_DISCONNECTED
      - name: Configure
        env:
          CLICOLOR_FORCE: 1
        shell: bash
        run: |
          set -xe
          cmake ${{ steps.cache-deps.outputs.cache-hit == 'true' && '-DFETCHCONTENT_FULLY_DISCONNECTED=ON' || '' }} -B build \
            ${{ inputs.cmake-config-additional-args }} \
            ${{ inputs.compiler-toolset == 'msvc' && format('-T {0},version={1}', inputs.msvc-platform-toolset, steps.setup.outputs.msvc-toolset) || '' }} \
            -DCMAKE_CXX_COMPILER=${{ inputs.compiler-executable }} \
            -DCMAKE_CXX_FLAGS="${{ inputs.compiler-cxxflags }}" \
            -DCMAKE_CXX_STANDARD=${{ inputs.cpp-version-number }} \
            -DCMAKE_BUILD_TYPE=${{ inputs.build-type-name }} \
            -DIRIS_CI=ON \
            -S .

      - name: Build Deps
        env:
          CLICOLOR_FORCE: 1
        run: |
          cmake --build build --config ${{ inputs.build-type-name }} -j${{ env.IRIS_CI_BUILD_JOBS }} --target Catch2WithMain ${{ inputs.compiler-builder-additional-args }}

      - name: Cache CMake Dependencies (save)
        # Due to some bogus "Unable to reserve cache with key" error, we *always* save the cache for now.
        # See this page for the rate limit: https://docs.github.com/en/actions/reference/limits#existing-system-limits
        # if: steps.cache-deps.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          key: ${{ steps.setup.outputs.deps-cache-key }}
          path: ${{ github.workspace }}/build/_deps

  build:
    name: ${{ matrix.component }}
    needs: prepare-deps
    runs-on: ${{ inputs.os-name }}-${{ inputs.os-version }}

    strategy:
      fail-fast: false

      matrix:
        component: ${{ fromJSON(inputs.components) }}

    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Copy Local GitHub Actions
        shell: bash
        run: |
          if [ -e modules/iris ]; then
            cp -r modules/iris/.github/actions .github/
          fi

      - name: Setup Toolchain
        id: setup
        uses: ./.github/actions/setup-cpp
        with:
          os-name: ${{ inputs.os-name }}
          os-version: ${{ inputs.os-version }}
          compiler-toolset: ${{ inputs.compiler-toolset }}
          compiler-version: ${{ inputs.compiler-version }}
          compiler-executable: ${{ inputs.compiler-executable }}
          msvc-toolset-prefix: ${{ inputs.msvc-toolset-prefix }}
          cpp-version-name: ${{ inputs.cpp-version-name }}
          build-type-name: ${{ inputs.build-type-name }}

      - name: Cache CMake Dependencies (restore)
        id: cache-deps
        uses: actions/cache/restore@v5
        with:
          key: ${{ steps.setup.outputs.deps-cache-key }}
          path: ${{ github.workspace }}/build/_deps

      # The cache can miss when this job lands on a runner image with another
      # toolset than prepare-deps did (e.g. during an image rollout); fetch the
      # dependencies again in that case.
      - name: Configure
        env:
          CLICOLOR_FORCE: 1
        shell: bash
        run: |
          set -xe
          cmake ${{ steps.cache-deps.outputs.cache-hit == 'true' && '-DFETCHCONTENT_FULLY_DISCONNECTED=ON' || '' }} -B build \
            ${{ inputs.compiler-toolset == 'msvc' && format('-T {0},version={1}', inputs.msvc-platform-toolset, steps.setup.outputs.msvc-toolset) || '' }} \
            -DCMAKE_CXX_COMPILER=${{ inputs.compiler-executable }} \
            -DCMAKE_CXX_FLAGS="${{ inputs.compiler-cxxflags }}" \
            -DCMAKE_CXX_STANDARD=${{ inputs.cpp-version-number }} \
            -DCMAKE_BUILD_TYPE=${{ inputs.build-type-name }} \
            -DIRIS_CI_COMPONENT=${{ matrix.component }} \
            -DIRIS_CI=ON \
            -S .

      - name: Build Tests
        env:
          CLICOLOR_FORCE: 1
        shell: bash
        run: |
          echo "CPPWARNINGNOTIFIER_LOG_MARKER"
          cmake --build build --config ${{ inputs.build-type-name }} -j${{ env.IRIS_CI_BUILD_JOBS }} ${{ inputs.compiler-builder-additional-args }}

      - name: Test
        env:
          CLICOLOR_FORCE: 1
        working-directory: ${{ github.workspace }}/build/test
        run: ctest --output-on-failure -C ${{ inputs.build-type-name }}
